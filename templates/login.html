<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0"
    >

    <title>
        Login - CampusShare
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>

<div class="register-container">

    <h1>Login</h1>

    <p class="register-text">
        Welcome back to CampusShare.
    </p>

    <form
        method="POST"
        action="/login"
    >

        <label for="email">
            University Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your university email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            class="primary-button"
        >
            Login
        </button>

    </form>

    <p class="login-link">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </p>

</div>

</body>

</html>
