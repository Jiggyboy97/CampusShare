<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0"
    >

    <title>
        Register - CampusShare
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>

<div class="register-container">

    <h1>Create Account</h1>

    <p class="register-text">
        Join CampusShare and start
        sharing equipment with other
        students.
    </p>

    <form
        method="POST"
        action="/register"
    >

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Beihang University Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="yourname@buaa.edu.cn"
            required
        >


        <label for="student-id">
            Student ID
        </label>

        <input
            type="text"
            id="student-id"
            name="student_id"
            placeholder="Enter your student ID"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <label for="confirm-password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >


        <button
            type="submit"
            class="primary-button"
        >
            Create Account
        </button>

    </form>

    <p class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </p>

</div>

</body>

</html>
